# apex3/config.yaml — Single Source of Truth for APEX-3 High-Profit Configuration

# --- Operating Mode ---
mode: "paper"  # "paper" or "live" — can also be overridden with CLI: --mode live
paper_starting_capital: 15000.00

account:
  starting_capital: 15000.00          # Base account equity in INR
  max_intraday_leverage: 4.0          # Zerodha MIS 4.0x leverage
  safety_reserve_buffer_pct: 0.05     # 5.0% (₹750) idle cash buffer for RMS safety
  fetch_live_zerodha_margin: true     # Pulls live available cash from kite.margins("equity")

risk_management:
  max_concurrent_positions: 2         # 2 slots max -> ₹28,500 leveraged budget per slot
  max_new_entries_per_bar: 1          # Only take the #1 ranked stock on any single 5m candle
  second_slot_requires_slot1_profit_r: 0.50  # Slot 2 only unlocks if Slot 1 is >= +0.5R
  risk_per_trade_pct: 0.0080          # 0.80% of equity (₹120.00 risk cap per trade)
  daily_loss_limit_pct: 0.0160        # 1.60% of equity (-₹240.00 hard daily stop = 2 losses)

session_schedule:
  timezone: "Asia/Kolkata"
  or_start_time: "09:15"              # Opening Range start
  or_end_time: "09:30"                # Opening Range locked at 09:30 IST
  entry_start_time: "09:30"           # Active Entry Window opens
  entry_cutoff_time: "13:00"          # Hard cutoff for new entries
  late_day_protection_time: "13:45"   # Time-based fee-lock evaluation
  square_off_time: "14:55"            # Orderly MIS liquidation before Zerodha 15:15 RMS
  flat_verification_time: "14:58"     # Verify zero open positions and zero pending SL/Target orders

regime_filter:
  benchmark_symbol: "NIFTY 50"
  benchmark_exchange: "NSE"
  ema_period: 20
  ema_slope_lookback: 3
  adx_period: 14
  min_adx: 22.0
  require_vwap_alignment: true        # Blocks post-gap sideways morning traps (Month 2 fix)
  require_rising_adx: true            # Requires ADX[t] > ADX[t-1]

signal_gates:
  rs_lookback_bars: 20                # 20-bar Relative Strength vs NIFTY 50
  volume_avg_bars: 20                 # 20-bar Volume SMA
  min_volume_surge_ratio: 2.0         # Gate 5: >= 2.0x institutional volume confirmation
  max_spread_bps: 4.0                 # Gate 6: Tightened from 8 bps to 4 bps for zero-slippage fills
  min_circuit_distance_pct: 0.020     # Gate 7: >= 2.0% away from upper/lower circuit
  min_atr_pct: 0.0022                 # Minimum 5m ATR(14) as % of price (filters dead stocks)
  min_stop_distance_pct: 0.0045       # Gate 9A: Minimum R = 0.45% (ensures 2R >= 0.90% to beat fees)
  max_stop_distance_pct: 0.0085       # Gate 9B: Maximum R = 0.85% (ensures 2R <= 1.70% is reachable)
  max_adr_consumed_pct: 0.60          # Gate 9C: Reject if stock already moved > 60% of 14-day ADR

stops_and_targets:
  swing_lookback_bars: 5              # 5-bar structural swing low/high anchor
  atr_period: 14                      # 14-bar 5-minute ATR
  atr_stop_multiplier: 1.5            # 1.5x ATR structural buffer (proven over 1.0x ATR)
  target_r_multiple: 2.0              # Fixed 2.0R limit target order
  trail_enabled: false                # Continuous trailing disabled (prevents choking runners)
  fee_lock_enabled: true              # One-time step to Entry +/- 0.15% to protect late winners
  fee_lock_trigger_r: 1.65            # Triggers when unrealized profit hits +1.65R (82.5% of target)
  late_day_lock_trigger_r: 0.75       # At 13:45 IST, locks Entry +/- 0.15% if trade is >= +0.75R
  fee_lock_offset_pct: 0.0015         # +0.15% covers 0.1065% Zerodha + statutory charges + 1 tick
  sl_limit_buffer_pct: 0.25           # Stop-limit buffer below/above trigger
  max_modifications_per_order: 25     # Kite order modification limit
  modification_headroom: 3

radar:
  # Tier 1: Audited Elite 10 Institutional Trend Leaders (Max Profitability & Low Friction)
  core_watchlist:
    - "HINDALCO"
    - "JSWSTEEL"
    - "RELIANCE"
    - "MARUTI"
    - "ITC"
    - "TCS"
    - "SBIN"
    - "TRENT"
    - "KOTAKBANK"
    - "SUNPHARMA"

  # Tier 2: Disabled by default to block negative-expectancy choppy whipsaws (HAL, AXISBANK, BEL, etc.)
  enable_extended_radar: false
  extended_radar:
    - "BEL"
    - "HAL"
    - "BHARTIARTL"

  # Tier 3: Optional Custom List (Disabled by default)
  custom_user_radar: []

# --- Auxiliary Compatibility Sections ---
entry:
  order_type: "LIMIT"
  max_slippage_pct: 0.15
  unfilled_timeout_sec: 30
  max_retries: 1

schedule:
  market_open: "09:15"
  opening_range_end: "09:30"
  entry_start: "09:30"
  entry_cutoff: "13:00"
  flatten_start: "14:55"
  flat_target: "14:58"
  market_close: "15:30"
  hard_deadline: "15:00"
  stale_threshold_sec: 2

  holidays_2026:
    - "2026-01-26"
    - "2026-03-10"
    - "2026-03-17"
    - "2026-03-31"
    - "2026-04-02"
    - "2026-04-06"
    - "2026-04-14"
    - "2026-05-01"
    - "2026-06-07"
    - "2026-07-07"
    - "2026-08-15"
    - "2026-08-19"
    - "2026-09-05"
    - "2026-10-02"
    - "2026-10-20"
    - "2026-11-09"
    - "2026-11-10"
    - "2026-11-30"
    - "2026-12-25"

rate_limits:
  orders_per_second: 10
  orders_per_minute: 200
  quotes_per_second: 1
  historical_per_second: 3
  general_per_second: 10

costs:
  brokerage_per_order: 20.0
  stt_pct: 0.025
  exchange_txn_pct: 0.00318
  gst_pct: 18.0
  sebi_turnover_pct: 0.0001
  stamp_duty_pct: 0.003

journal:
  db_path: "apex3_journal.db"
  log_decisions: true
  log_orders: true
  log_fills: true
  log_stop_changes: true
  log_warnings: true
  log_daily_summary: true

dashboard:
  host: "0.0.0.0"
  port: 5000
  refresh_interval_sec: 2
