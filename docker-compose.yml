services:
  apex3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apex3-engine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=Asia/Kolkata
      - PYTHONUNBUFFERED=1
    # Bind dashboard strictly to loopback (127.0.0.1:5000) for SSH tunnel / Cloudflare tunnel safety
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./.env:/app/.env
      - ./apex3_journal.db:/app/apex3_journal.db
      - ./info.log:/app/info.log
      - ./logs:/app/logs
    command: >
      python -m apex3.main
      --mode ${APEX3_MODE:-paper}
      --host 0.0.0.0
      --port 5000
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
